modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Yeshengo"
description = "A modern industrialization addon that adds parallel control hatches to multiblocks."
logoFile = ""

[[mixins]]
config = "bingxing.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
mandatory = true
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "modern_industrialization"
mandatory = true
versionRange = "[2.4.0,)"
ordering = "AFTER"
side = "BOTH"